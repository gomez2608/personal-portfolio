name: Opinion

# `/opinion <slug>` + newline + text, commented on a PR by gomez2608 (not via a GitHub App), is
# copied verbatim into app/blog/<slug>/post.json → opinion. No AI runs here: this workflow is the
# only writer an opinion has; opinion-guard.yml rejects any opinion that doesn't match such a comment.
# Only `created` triggers it: editing a comment does nothing here, and the guard rejects edited ones.
#
# issue_comment always runs this file from the default branch. The PR branch is checked out into
# ./pr and only its post.json is touched: no code or dependencies from the PR run with this token.

on:
  issue_comment:
    types: [created]

# No concurrency group: a queued group keeps only one pending run, so a third quick /opinion would
# be dropped. Runs go in parallel instead; each commit touches a different post.json, and the push
# step rebases and retries when another run pushed first.

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  opinion:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'gomez2608' &&
      github.event.comment.performed_via_github_app == null &&
      startsWith(github.event.comment.body, '/opinion ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          info=$(gh pr view "$PR" --json headRefName,headRepositoryOwner,isCrossRepository,state)
          branch=$(jq -r '.headRefName' <<<"$info")
          owner=$(jq -r '.headRepositoryOwner.login' <<<"$info")
          cross=$(jq -r '.isCrossRepository' <<<"$info")
          state=$(jq -r '.state' <<<"$info")
          if [ "$owner" != "gomez2608" ] || [ "$cross" != "false" ]; then
            echo "::error::Refusing a PR from a fork ($owner)."
            exit 1
          fi
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR is $state."
            exit 1
          fi
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || [ "$branch" = "master" ]; then
            echo "::error::Refusing branch name: $branch"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Trusted code: the default branch, where this workflow file lives.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Untrusted data: the PR branch. Only its post.json is read and written.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: pr

      - name: List the PR's changed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"

      - name: Apply the opinion
        id: apply
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          POST_ROOT: pr
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
        run: npx tsx scripts/blog/apply-opinion.ts

      - name: Reply with the error
        if: steps.apply.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ERROR: ${{ steps.apply.outputs.error }}
        run: |
          set -euo pipefail
          printf 'No apliqué la opinión: %s\n' "$ERROR" | gh pr comment "$PR" --body-file -
          exit 0

      - name: Reply that nothing changed
        if: steps.apply.outputs.status == 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SLUG: ${{ steps.apply.outputs.slug }}
        run: |
          set -euo pipefail
          printf 'La opinión de `%s` ya tenía exactamente ese texto; no hay nada que commitear.\n' "$SLUG" | gh pr comment "$PR" --body-file -

      - name: Commit and push
        id: push
        if: steps.apply.outputs.status == 'ok'
        working-directory: pr
        env:
          SLUG: ${{ steps.apply.outputs.slug }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "app/blog/$SLUG/post.json"
          # Only post.json may be in this commit.
          if [ "$(git diff --cached --name-only)" != "app/blog/$SLUG/post.json" ]; then
            echo "::error::Unexpected staged files"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "opinion: $SLUG"
          # First push plus up to 3 retries. Another /opinion run (or the agent) may have pushed in
          # between; rebasing our one-file commit on top is safe, and the guard re-checks the result.
          err="$RUNNER_TEMP/push.err"
          reason=""
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/$BRANCH" 2>"$err"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$err" >&2
            [ "$attempt" -lt 4 ] || break
            sleep $((attempt * 5))
            if ! git pull --rebase origin "$BRANCH" 2>"$err"; then
              cat "$err" >&2
              git rebase --abort 2>/dev/null || true
              reason="otro commit cambió el mismo post.json mientras lo guardaba"
              break
            fi
          done
          [ -n "$reason" ] || reason=$(grep -v '^[[:space:]]*$' "$err" | tail -n 1 | cut -c1-200 || true)
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "pushed=false"
            echo "error<<$delim"
            echo "${reason:-git push falló}"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "::warning::Push failed after retries: ${reason:-unknown}"

      - name: Reply that the push failed
        if: steps.push.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SLUG: ${{ steps.apply.outputs.slug }}
          ERROR: ${{ steps.push.outputs.error }}
        run: |
          set -euo pipefail
          printf 'No pude guardar tu /opinion para `%s`: %s; vuelve a comentarlo.\n' "$SLUG" "$ERROR" | gh pr comment "$PR" --body-file -
          exit 0

      - name: React and re-run the PR checks
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Assumption: a reaction doesn't change the comment's updated_at on GitHub, so this 👍
          # doesn't make opinion-guard treat the comment as edited.
          gh api --method POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 > /dev/null
          # A push made with GITHUB_TOKEN doesn't trigger pull_request(_target) workflows; workflow_dispatch does.
          gh workflow run blog-pr-checks.yml --ref "$BRANCH"
          gh workflow run opinion-guard.yml --ref "$DEFAULT_BRANCH" -f pr="$PR"
