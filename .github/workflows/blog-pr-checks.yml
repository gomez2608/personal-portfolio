name: Blog PR checks

on:
  pull_request:
    branches: [master]
  # Dispatched by opinion.yml after it pushes, since GITHUB_TOKEN pushes don't trigger pull_request.
  workflow_dispatch:

concurrency:
  group: blog-pr-checks-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is what a ruleset requires; keep it fixed.
  blog-pr-checks:
    name: blog-pr-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # The PR head itself (not the synthetic merge commit), so both triggers check the same code.
      # Full history, so the issue-file step can find the merge base with origin/master.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run blog:check

      # Every newsletter issue the PR adds or edits must pass the same validation the send uses.
      # --dry-run touches no secrets and no network; it only renders .newsletter-preview/.
      - name: Dry-run changed newsletter issues
        run: |
          set -euo pipefail
          base=$(git merge-base origin/master HEAD)
          files=$(git diff --no-renames --diff-filter=AM --name-only "$base" HEAD -- 'newsletter/issues/*.json')
          if [ -z "$files" ]; then
            echo "No newsletter issue files added or modified."
            exit 0
          fi
          for f in $files; do
            if ! [[ "$f" =~ ^newsletter/issues/[0-9]{4}\.json$ ]]; then
              echo "::error file=$f::Issue files must be named NNNN.json (4 digits)"
              exit 1
            fi
            n=$((10#$(basename "$f" .json)))
            echo "::group::Issue $n ($f)"
            npm run newsletter:send -- --issue "$n" --dry-run
            echo "::endgroup::"
          done

      - run: npm run build

  # Runs started by workflow_dispatch (opinion.yml re-runs the checks after its bot push) aren't
  # linked to the PR, so the master ruleset doesn't count their check run. This job mirrors the
  # result as a commit status with the same context on the PR head, which the ruleset does count.
  # It is a separate job on purpose: it never checks out or runs PR code, so `statuses: write`
  # never reaches anything the PR controls (the job above keeps a read-only token).
  report-status:
    name: blog-pr-checks-status
    needs: blog-pr-checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post blog-pr-checks commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ needs.blog-pr-checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head SHA"
            exit 1
          fi
          if [ "$RESULT" = "success" ]; then
            state=success; desc="Tests, lint, blog:check y build en verde"
          else
            state=failure; desc="Fallaron los chequeos del blog ($RESULT)"
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="blog-pr-checks" \
            -f description="$desc" -f target_url="$RUN_URL" >/dev/null
          echo "blog-pr-checks status: $state on $SHA"
